name: mine-bedrock

services:
  bds:
    image: itzg/minecraft-bedrock-server:stable
    pull_policy: daily
    container_name: mine-bedrock
    restart: unless-stopped
    stop_grace_period: 120s
    tty: true
    stdin_open: true
    # O healthcheck da propria imagem roda mc-monitor, que faz ping raknet e
    # nunca tem resposta sob transport=nethernet (era o bug de pong de 33 bytes,
    # issue itzg#649, que nao existe mais nesse transporte). Desligado: quem
    # checa de verdade e o /status do bot, que le o log do boot atual
    # ("Server started.") e mostra quantos jogadores estao online.
    healthcheck:
      disable: true
    environment:
      EULA: "TRUE"
      # Reavalia a cada start: no restart das 05:00 cai para a estavel mais nova.
      VERSION: "${VERSION:-LATEST}"
      UID: "${PUID:-1000}"
      GID: "${PGID:-1000}"
      TZ: "${TZ:-America/Sao_Paulo}"
      # Aviso importante: daqui para baixo estao SO as variaveis de primeira
      # instalacao. Nao coloque aqui gamemode, difficulty, max-players,
      # view-distance, server-name, allow-list, white-list ou
      # default-player-permission-level.
      #
      # O image NAO reescreve o /data/server.properties inteiro: o
      # bedrock-entry.sh so passa para o arquivo as propriedades que tem
      # variavel de ambiente SETADA (set-property --bulk). Entao o que o bot
      # grava por /config fica no arquivo, e o que o bot guardou no SQLite
      # (/state/bot.db) reaparece sozinho pelo reconciliador de 60s.
      #
      # A excecao e o LEVEL_NAME: ele e das duas coisas ao mesmo tempo, porque
      # o entry usa para montar worlds/<LEVEL_NAME> e o set-property escreve
      # level-name. Quem manda no nome da pasta do mundo e o compose; o bot
      # avisa isso no /config level-name.
      LEVEL_NAME: "${LEVEL_NAME:-world}"
      # OFF de proposito. Isto e' o servidor responder a quem procura servidores
      # na LAN. Numa VPS publica nao serve pra nada e vaza o servidor para
      # qualquer rede em que alguem se plugue (wifi de cafe, rede do vizinho).
      #
      # Ja foi workaround do bug de pong de 33 bytes (itzg#649), mas esse bug
      # era do raknet e nao existe no nethernet, que e' o transporte desta
      # versao. Conferido com "false": o signalling fica identico - o log
      # continua "Accepting clients on [::]:19132" e o /v1/join devolve 200.
      ENABLE_LAN_VISIBILITY: "false"
      CONTENT_LOG_FILE_ENABLED: "true"
      CONTENT_LOG_LEVEL: "info"
      # O aviso de desligamento e do bot (ele sabe o motivo: atualizacao, pack
      # novo...). Deixamos o do image em 0 para nao duplicar a contagem: com
      # STOP_SERVER_ANNOUNCE_DELAY > 0 o image escreve o aviso no SIGTERM e
      # so depois de N segundos manda o "stop", o que daria 2 esperas em
      # fila. O "stop" imediato ainda salva o mundo, e o stop_grace_period
      # abaixo cobre o caso do SIGKILL.
      STOP_SERVER_ANNOUNCE_DELAY: "0"
      OPS: "${OPS:-}"
      # So se a rede host NAO bastar (NAT do provedor sem porta fixa, ou
      # servidor com mais de um IP). Fixa o IP que o nethernet anuncia como
      # candidato, e' o que o cliente tenta. Vazio = o BDS escolhe sozinho a
      # partir das interfaces do host, que e' o certo na maioria dos casos.
      # Custo: com o IP fixado, quem estiver na mesma LAN deixa de entrar.
      SERVER_IP: "${SERVER_IP:-}"
    network_mode: host
    # SEM bloco `ports:` de proposito. O nethernet (BDS 1.26.51+) nao e so
    # "abrir a porta": o servidor sorteia os candidatos ICE a partir das
    # interfaces que ele enxerga e anuncia um deles via serviço de signalling
    # da Mojang. Em rede bridge ele enxerga a interface do container
    # (172.x.x.x) e anuncia isso - um endereco que o cliente da internet nao
    # alcanca. Da no sintoma classico: signalling responde (/v1/join devolve
    # JSON), o server aparece na lista, e a conexao morre em "Door" /
    # InitialConnection sem evento nenhum no console do BDS.
    #
    # Nao ha solucao por `ports:`: publicar porta nao corrige o endereco
    # anunciado. Todo config que funciona com esse transporte usa rede host.
    #
    # Consequencias no host (a firewall e a sua):
    #   - TCP 19132   signalling HTTP (e o /v1/join, que o healthcheck usa)
    #   - UDP 7551    porta fixa do NetherNet, aberta em qualquer config
    #   - UDP 19133-72 gameplay WebRTC, a faixa de server-udp-ports
    #
    # O bds escuta direto na interface do host, entao o `ports:` e' ignorado
    # (o Docker ainda avisa no `up`). Aponte o DNS/Cloudflare para TCP 19132
    # e deixe o record em cinza: Cloudflare so proxya TCP, nao UDP.
    volumes:
      - ./data:/data
      # O BDS ignora este arquivo (Bedrock nao tem icone de servidor proprio),
      # mas fica montado para o caso de um dia rodar Geyser/Java na frente.
      - ./assets/server-icon.png:/data/server-icon.png:ro

  bot:
    build:
      context: ./bot
    image: mine-bedrock-bot:latest
    container_name: mine-bedrock-bot
    restart: unless-stopped
    # mesmo uid/gid do bds: senao o bot cria arquivos no /data que o BDS nao consegue reescrever
    user: "${PUID:-1000}:${PGID:-1000}"
    group_add:
      - "989"
    env_file:
      - .env
    environment:
      TZ: "${TZ:-America/Sao_Paulo}"
      BDS_CONTAINER: "mine-bedrock"
      BDS_DATA_DIR: "/data"
      # O bds esta em network_mode: host, entao ele some da rede bridge e o
      # nome "mine-bedrock" deixa de resolver daqui. O ping so do /status e
      # do watchdog apontam para o IP do host, que e onde a 19132 esta
      # escutando agora. No nethernet o unconnected ping nunca responde mesmo
      # (o BDS nao binda UDP na 19132), entao isso e' so para o erro do
      # watchdog ser honesto em vez de "no such host".
      BDS_HOST: "host.docker.internal"
      STATE_DIR: "/state"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
      # /state: o bot.db (usuarios, hashes das chaves, overrides, auditoria).
      # Precisa ser volume: se ficar no container, um recreate apaga os acessos.
      - ./state:/state
      # icon e logs de staging, so de leitura
      - ./assets/server-icon.png:/app/assets/server-icon.png:ro
      # root no host: quem manda no bot manda no docker. Mitigado pelo codigo de
      # resgate (um admin so, escolhido pelo segredo do .env) e pelas chaves de
      # leitura, que nao entram em nenhum comando de docker. O bot nao expoe
      # porta nenhuma e so conversa com o Telegram.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - bds
