# Minecraft Bedrock (BDS 1.26.52+, transport=nethernet).
# Este arquivo NAO tem bloco stream {}: ele e incluido de dentro do stream {}
# que fica no fim do nginx.conf principal:
#
#   stream {
#       include /etc/nginx/stream.d/*.conf;   <-- este arquivo entra aqui
#       ... (o resto do seu bloco stream) ...
#   }
#
# Se voce criar o bloco stream do zero, use este arquivo e o include acima.
# Se voce nao puder mexer no nginx.conf, cole o bloco completo de
# nginx.conf.stream no lugar do stream {} e ignore este arquivo.
#
# O nome e resolvido em tempo de execucao (por causa do $var + resolver),
# entao o nginx sobe mesmo que o container do jogo ainda nao exista.
#
# ---------------------------------------------------------------------------
# POR QUE TEM DOIS BLOCOS
#
# O nethernet nao e um protocolo so. Sao duas etapas e cada uma precisa do seu
# tipo de proxy:
#
#   1) TCP 19132 - signalling. O cliente abre uma conexao HTTP e negocia o ICE.
#      E por isso que o BDS abre "um socket TCP dual-stack em server-port" e o
#      proprio log dele diz "Accepting clients on [::]:19132". A doc do BDS
#      recomenda explicitamente um reverse proxy aqui.
#
#   2) UDP 19133-19172 - gameplay. Depois do handshake o trafego de jogo viaja
#      por WebRTC/ICE, e o SO sorteia uma porta efemera para cada cliente. Isso
#      so funciona atras de NAT/firewall se a faixa for fixada, via
#      server-udp-ports no server.properties:
#
#         server-udp-ports=19133-19172:19133-19172
#
#      O "externo" e o que o cliente procura, o "interno" e onde o BDS abre.
#      Aqui os dois lados batem, entao o proxy e 1:1 e nao precisa de mapa.
#      ESSA FAIXA PRECISA BATER COM A DO server.properties. Se voce mudar la,
#      mude aqui e no compose do nginx.
#
# Sem o bloco UDP o handshake TCP ate completa e o jogo trava ao entrar.

# DNS interno do Docker (127.0.0.11). ipv6=off porque a rede proxy e IPv4.
resolver 127.0.0.11 valid=10s ipv6=off;

# --- 1) signalling: TCP puro, como qualquer socket ------------------------
server {
    listen 0.0.0.0:19132;

    set $jogo mine-bedrock:19132;
    proxy_pass $jogo;

    # O handshake HTTP e rapido; 5s ja sobra. o timeout longo fica so no UDP.
    proxy_connect_timeout 5s;
    proxy_timeout 300s;

    # Nao descomente proxy_responses 0 aqui: ele existe para protocolos sem
    # handshake (o raknet antigo), e aqui atrapalharia o HTTP.
}

# --- 2) gameplay: faixa UDP do nethernet ----------------------------------
server {
    # Faixa 1:1, casa com server-udp-ports=19133-19172:19133-19172.
    listen 19133-19172 udp reuseport;

    set $jogo_udp mine-bedrock:19133-19172;
    proxy_pass $jogo_udp;

    # Bedrock nao tem "resposta esperada": sem isso o nginx espera o
    # handshake SYN e derruba a sessao.
    proxy_responses 0;

    # Jogador parado no jogo nao manda pacote; 1h de silencio e normal.
    proxy_timeout 3600s;
}
